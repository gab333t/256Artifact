<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>256Artifact</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<div id="scroll-track" class="scroll-track"></div>

<div class="viewport">
  <div class="scene">
    <div class="strip" id="strip"></div>
  </div>
</div>

<div class="detail" id="detail">
  <div class="detail-box">
    <img class="detail-img" id="detail-img" alt="">
  </div>
  <span class="dmark tr"></span>
  <span class="dmark bl"></span>
  <span class="dmark br"></span>
  <span class="detail-tag col-date" id="detail-date"></span>
  <span class="detail-tag col-time" id="detail-time"></span>
  <span class="detail-tag col-coords" id="detail-coords"></span>
  <div class="detail-field col-date">
    <div class="field-rule"></div>
    <div class="field-label">Date</div>
  </div>
  <div class="detail-field col-time">
    <div class="field-rule"></div>
    <div class="field-label">Time</div>
  </div>
  <div class="detail-field col-coords">
    <div class="field-rule"></div>
    <div class="field-label">Coordinates</div>
  </div>
  <div class="detail-about">
    <p class="detail-about-text" id="detail-about"></p>
    <div class="field-rule"></div>
    <div class="field-label">About</div>
  </div>
</div>

<div class="crop-marks" aria-hidden="true">
  <span class="cropmark tl"></span>
  <span class="cropmark tr"></span>
  <span class="cropmark bl"></span>
  <span class="cropmark br"></span>
</div>

<div class="plaque">
  <div class="plaque-title" id="plaque-title">256Artifact</div>
  <div class="plaque-rule"></div>
  <div class="plaque-caption" id="plaque-caption">
    <span id="plaque-number"></span>
    <span class="plaque-dot">■</span>
    <span id="plaque-name"></span>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
